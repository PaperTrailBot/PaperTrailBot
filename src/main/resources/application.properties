# General
papertrail.general.app.name=${APP_NAME:PaperTrailBot}
papertrail.general.app.version=${quarkus.application.version:N/A}
papertrail.general.app.activity=${APP_ACTIVITY: }
papertrail.general.github.issue.link=https://github.com/PaperTrailBot/PaperTrailBot/issues

# Token
papertrail.discord.token=${TOKEN}

# PaperTrail API URL
quarkus.rest-client.guild-api.url=${API_URL}
quarkus.rest-client.message-api.url=${API_URL}
# Uncomment these when u wanna log API responses
# quarkus.rest-client.logging.scope=request-response
# quarkus.rest-client.logging.body-limit=2000

# Embed Color Config
papertrail.embed-color.success.color.integer=${EMBED_SUCCESS_COLOR_INT:712458}
papertrail.embed-color.warning.color.integer=${EMBED_WARNING_COLOR_INT:16776960}
papertrail.embed-color.destructive.color.integer=${EMBED_DESTRUCTIVE_COLOR_INT:16711680}

#Port
quarkus.http.port=${PORT:8080}
quarkus.management.enabled=true
quarkus.management.port=${MANAGEMENT_PORT:9000}

# Logging Level
quarkus.log.level=${GLOBAL_LOG_LEVEL:INFO}
quarkus.log.category."io.github.eggy03.papertrail".level=${APP_LOG_LEVEL:INFO}

# Analytics
quarkus.analytics.disabled=true

# Banner
quarkus.banner.path=banner.txt

# Native Build Args
quarkus.native.additional-build-args=\
    --trace-object-instantiation=java.security.SecureRandom,\
    --initialize-at-run-time=\
        com.neovisionaries.ws.client.Misc\\,\
        net.dv8tion.jda.internal.audio.CryptoAdapter$AbstractAaedAdapter\\,\
        net.dv8tion.jda.internal.requests.restaction.MessageCreateActionImpl